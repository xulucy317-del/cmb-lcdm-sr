[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmb-lcdm-sr"
version = "1.0.0"
description = "Blind symbolic interpretation of CMB beta-VAE latents: MI-scored symbolic regression with a pure-Julia GMM-MI inner loss, a pre-registered validation programme, and a linear baseline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ziyu Xu", email = "zx332@cam.ac.uk" }]
keywords = ["cosmology", "CMB", "variational autoencoder", "symbolic regression", "mutual information", "interpretability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "sympy",
    "pandas",
    "matplotlib",
    "scikit-learn<1.6",   # gmm-mi uses sklearn._validate_data; removed in 1.6+
    "gmm-mi",             # post-hoc MI estimator (Piras+2023)
    "pysr>=1.5",          # study ran on PySR 1.5.10 / Julia 1.11.9
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/xulucy317-del/cmb-lcdm-sr"
"Write-up of record" = "https://github.com/xulucy317-del/cmb-lcdm-sr/blob/main/report_conclusive.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
